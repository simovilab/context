[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infotp_composer"
version = "0.1.0"
description = "Composition engine for InfoTP Context Studio — cascading Project -> Component -> Deliverable context."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
infotp-composer = "infotp_composer.cli:main"

[tool.setuptools.packages.find]
include = ["infotp_composer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
