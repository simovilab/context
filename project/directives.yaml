version: 1
directives:
- key: security.transport-encryption
  op: set
  applies_to:
  - software
  - api
  - infra
  text: >
    All traffic to and from the system must be encrypted in transit via
    HTTPS/TLS or an equivalent protocol (CS4).
  lang: en
- key: security.authn-authz
  op: set
  applies_to:
  - software
  - api
  text: >
    Authentication and authorization must use mechanisms with token expiration
    and controlled renewal, for both human users and system-to-system access
    (CS5).
  lang: en
- key: security.input-validation
  op: set
  applies_to:
  - software
  - api
  text: >
    All inputs on web interfaces must be validated to prevent SQL injection,
    XSS, and CSRF attacks (CS8).
  lang: en
- key: security.audit-logging
  op: set
  applies_to:
  - software
  - api
  - data
  text: >
    Handling of public-transport data must produce activity logs sufficient for
    traceability, audit, and anomaly detection (CS6).
  lang: en
- key: security.no-sensitive-in-source
  op: set
  applies_to:
  - software
  - data
  - docs
  - api
  - infra
  text: >
    Source code must never contain personal, institutional, or
    business-sensitive data; never commit secrets, credentials, or internal URLs
    (CS2).
  lang: en
- key: security.database-hardening
  op: set
  applies_to:
  - data
  - software
  text: >
    Databases must sit behind authentication with strong credential and password
    policies, and must have periodic backup policies to prevent data loss (CS3).
  lang: en
- key: security.monitoring
  op: set
  applies_to:
  - infra
  text: >
    Performance and security must be monitored with specialized software
    providing 24/7 alerting for cyberattacks and operational faults (CS7).
  lang: en
- key: security.hosting
  op: set
  applies_to:
  - infra
  text: >
    During the development period, the system must be hosted on University of
    Costa Rica (UCR) servers, which provide high-level security and 24/7 attack
    response (CS1).
  lang: en
- key: data.no-pii
  op: set
  applies_to:
  - software
  - data
  - docs
  - api
  - infra
  - research
  text: >
    Never collect, store, or publish personally identifiable information (PII).
    No PII is required for this system, and this is a hard commitment, not a
    target.
  lang: en
- key: data.open-license
  op: set
  applies_to:
  - data
  - docs
  text: >
    Published GTFS data must use an open, permissive license (recommended:
    Creative Commons Attribution 3.0 / CC BY 3.0). Published data is open and
    public domain, with no access or use restrictions.
  lang: en
- key: data.fair-mdip
  op: set
  applies_to:
  - data
  - api
  text: >
    Published data must be Findable, Accessible, Interoperable, and Reusable
    (FAIR), and must align with the Mobility Data Interoperability Principles
    (MDIP).
  lang: en
- key: data.gtfs-standard
  op: set
  applies_to:
  - data
  - api
  - software
  text: >
    GTFS is the canonical exchange format for this system: GTFS Schedule for
    static data and GTFS Realtime Alerts for operational alerts.
  lang: en
- key: code.open-source
  op: set
  applies_to:
  - software
  text: |
    Software must be released open-source under a permissive license.
  lang: en
- key: code.review-and-commits
  op: set
  applies_to:
  - software
  - data
  - docs
  - api
  - infra
  text: >
    Changes must land via reviewed pull requests. Use Conventional Commits
    (feat, fix, docs, chore, refactor, test, perf, ci) for all commit messages.
  lang: en
- key: docs.language-policy
  op: set
  applies_to:
  - docs
  text: >
    Write technical and agent-facing documentation in English; use Spanish for
    institution-facing content such as public materials and deliverable names.
    Never mix languages within a single file (D7).
  lang: en
