name: context-ci

# Guards the InfoTP context store: schemas, composition, and freshness.
on:
  push:
    branches: [infotp]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: validate & compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install composer + RAG engine
        run: uv pip install --system -e "tools/composer[dev]" -e "tools/rag[dev]"

      - name: Unit tests (composer)
        working-directory: tools/composer
        run: pytest -q --cov=infotp_composer --cov-report=term-missing

      - name: Unit tests (RAG)
        working-directory: tools/rag
        run: pytest -q --cov=infotp_rag --cov-report=term-missing

      - name: Validate schemas + composition + freshness (D4)
        # `compose --check` loads and schema-validates every node.yaml /
        # directives.yaml, runs the depends_on cycle check, and fails if any
        # .composed/<ID>.{json,md} is stale versus the source tree.
        run: python -m infotp_composer compose --check

      - name: RAG index + retrieval smoke (D10, hashing, no network)
        # Builds the branch-scoped index with the deterministic offline
        # embedder and confirms a query returns and exits 0. The .rag/ index is
        # a gitignored build artifact and is never asserted into the tree.
        run: |
          python -m infotp_rag index --all
          python -m infotp_rag query C1P1 "public transport information" -k 3 --json

  mcp:
    name: mcp server (P4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: tools/mcp/pnpm-lock.yaml

      - name: Install
        working-directory: tools/mcp
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: tools/mcp
        run: pnpm run typecheck

      - name: Build
        working-directory: tools/mcp
        run: pnpm run build

      - name: Unit tests (mocked spawn)
        # The real-Python branch-isolation integration test self-skips here
        # (no repo .venv on the runner); the mocked-spawn tool/catalog/validate
        # suites cover the MCP seam. The engine's own scoping is asserted in the
        # `validate` job's RAG smoke.
        working-directory: tools/mcp
        run: pnpm test
